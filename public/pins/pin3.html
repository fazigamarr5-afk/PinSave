<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1000px; height: 1500px; background: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 80px; }
.top-bar { width: 100%; height: 8px; background: #E11D48; border-radius: 4px; margin-bottom: 60px; }
h1 { font-size: 64px; font-weight: 800; color: #0f172a; text-align: center; line-height: 1.1; margin-bottom: 30px; }
h1 span { color: #E11D48; }
.subtitle { font-size: 26px; color: #64748b; text-align: center; margin-bottom: 60px; }
.comparison { width: 100%; border: 2px solid #e2e8f0; border-radius: 16px; overflow: hidden; margin-bottom: 60px; }
.row { display: flex; border-bottom: 1px solid #e2e8f0; }
.row:last-child { border-bottom: none; }
.cell { flex: 1; padding: 20px 24px; font-size: 20px; }
.header { background: #f8fafc; font-weight: 700; color: #334155; }
.tool { color: #64748b; }
.check { color: #22c55e; font-size: 24px; }
.cross { color: #ef4444; font-size: 24px; }
.highlight { background: #fef2f2; }
.cta { background: #E11D48; color: white; padding: 20px 60px; border-radius: 50px; font-size: 32px; font-weight: 700; }
.brand { margin-top: 40px; font-size: 24px; color: #94a3b8; }
</style>
</head>
<body>
<div class="top-bar"></div>
<h1>Best <span>Pinterest</span> Downloader</h1>
<p class="subtitle">Compare the top free tools</p>
<div class="comparison">
<div class="row"><div class="cell header">Feature</div><div class="cell header">SavePin</div><div class="cell header">Others</div></div>
<div class="row highlight"><div class="cell tool">No Watermark</div><div class="cell check">✓ Yes</div><div class="cell cross">✗ Sometimes</div></div>
<div class="row"><div class="cell tool">HD Quality</div><div class="cell check">✓ 1080p</div><div class="cell cross">✗ 720p</div></div>
<div class="row highlight"><div class="cell tool">Speed</div><div class="cell check">✓ 2 sec</div><div class="cell cross">✗ 10+ sec</div></div>
<div class="row"><div class="cell tool">No Login</div><div class="cell check">✓ Yes</div><div class="cell cross">✗ Required</div></div>
<div class="row highlight"><div class="cell tool">Free</div><div class="cell check">✓ 100%</div><div class="cell cross">✗ Paid</div></div>
</div>
<div class="cta">Try SavePin Free →</div>
<p class="brand">npftas.xyz</p>
</body>
</html>
