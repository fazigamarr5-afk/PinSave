<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1000px; height: 1500px; background: #0f172a; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: white; padding: 80px; }
.badge { background: #E11D48; color: white; padding: 10px 30px; border-radius: 50px; font-size: 20px; font-weight: 600; margin-bottom: 40px; letter-spacing: 2px; text-transform: uppercase; }
h1 { font-size: 68px; font-weight: 800; text-align: center; line-height: 1.1; margin-bottom: 30px; }
h1 span { color: #E11D48; }
.subtitle { font-size: 28px; text-align: center; color: #94a3b8; line-height: 1.4; margin-bottom: 60px; }
.features { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 60px; }
.feature { background: #1e293b; padding: 30px; border-radius: 16px; border: 1px solid #334155; }
.feature-icon { font-size: 36px; margin-bottom: 12px; }
.feature-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
.feature-desc { font-size: 18px; color: #94a3b8; }
.cta { background: #E11D48; color: white; padding: 20px 60px; border-radius: 50px; font-size: 32px; font-weight: 700; }
.brand { margin-top: 40px; font-size: 24px; color: #64748b; }
</style>
</head>
<body>
<div class="badge">Free Tool</div>
<h1>Pinterest <span>Downloader</span></h1>
<p class="subtitle">Download videos, images, and GIFs in HD quality</p>
<div class="features">
<div class="feature"><div class="feature-icon">🎬</div><div class="feature-title">No Watermark</div><div class="feature-desc">Original quality, no branding</div></div>
<div class="feature"><div class="feature-icon">⚡</div><div class="feature-title">2 Seconds</div><div class="feature-desc">Fastest Pinterest downloader</div></div>
<div class="feature"><div class="feature-icon">📱</div><div class="feature-title">All Devices</div><div class="feature-desc">iPhone, Android, PC, Mac</div></div>
<div class="feature"><div class="feature-icon">🔒</div><div class="feature-title">No Login</div><div class="feature-desc">Use instantly, no account needed</div></div>
</div>
<div class="cta">Download Now →</div>
<p class="brand">npftas.xyz</p>
</body>
</html>
