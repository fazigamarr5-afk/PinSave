<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1000px; height: 1500px; background: linear-gradient(135deg, #E11D48 0%, #BE123C 50%, #9F1239 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: white; padding: 80px; }
.icon { width: 120px; height: 120px; background: white; border-radius: 24px; display: flex; align-items: center; justify-content: center; margin-bottom: 40px; }
.icon svg { width: 60px; height: 60px; }
h1 { font-size: 72px; font-weight: 800; text-align: center; line-height: 1.1; margin-bottom: 30px; }
.subtitle { font-size: 32px; text-align: center; opacity: 0.9; line-height: 1.4; margin-bottom: 50px; }
.steps { width: 100%; background: rgba(255,255,255,0.15); border-radius: 20px; padding: 40px; margin-bottom: 50px; }
.step { display: flex; align-items: center; gap: 20px; margin-bottom: 25px; }
.step:last-child { margin-bottom: 0; }
.num { width: 50px; height: 50px; background: white; color: #E11D48; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 800; flex-shrink: 0; }
.step-text { font-size: 28px; font-weight: 500; }
.cta { background: white; color: #E11D48; padding: 20px 60px; border-radius: 50px; font-size: 32px; font-weight: 700; }
.brand { margin-top: 40px; font-size: 24px; opacity: 0.8; }
</style>
</head>
<body>
<div class="icon">
<svg viewBox="0 0 24 24" fill="none" stroke="#E11D48" stroke-width="2"><path d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.348a1.125 1.125 0 010 1.971l-11.54 6.347a1.125 1.125 0 01-1.667-.985V5.653z"/></svg>
</div>
<h1>How to Download Pinterest Videos</h1>
<p class="subtitle">Free, HD quality, no watermark</p>
<div class="steps">
<div class="step"><div class="num">1</div><div class="step-text">Copy the Pinterest video URL</div></div>
<div class="step"><div class="num">2</div><div class="step-text">Paste it into SavePin</div></div>
<div class="step"><div class="num">3</div><div class="step-text">Click Download — done!</div></div>
</div>
<div class="cta">Try SavePin Free →</div>
<p class="brand">npftas.xyz</p>
</body>
</html>
