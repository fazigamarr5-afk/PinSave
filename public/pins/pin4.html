<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1000px; height: 1500px; background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: white; padding: 80px; }
.phone { width: 360px; height: 640px; background: #1e293b; border-radius: 30px; border: 3px solid #334155; padding: 20px; margin-bottom: 50px; position: relative; overflow: hidden; }
.phone-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.phone-logo { width: 40px; height: 40px; background: #E11D48; border-radius: 10px; }
.phone-title { font-size: 18px; font-weight: 700; }
.phone-url { background: #0f172a; border-radius: 10px; padding: 14px 16px; font-size: 14px; color: #94a3b8; margin-bottom: 16px; border: 1px solid #334155; }
.phone-btn { background: #E11D48; color: white; width: 100%; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 700; text-align: center; margin-bottom: 20px; }
.phone-result { background: #0f172a; border-radius: 12px; padding: 16px; border: 1px solid #334155; }
.phone-result-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #1e293b; }
.phone-result-row:last-child { border-bottom: none; }
.badge-hd { background: #22c55e; color: white; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; }
.download-btn { background: #E11D48; color: white; padding: 8px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; }
h1 { font-size: 56px; font-weight: 800; text-align: center; line-height: 1.1; margin-bottom: 20px; }
h1 span { color: #E11D48; }
.subtitle { font-size: 26px; color: #94a3b8; text-align: center; margin-bottom: 40px; }
.cta { background: #E11D48; color: white; padding: 20px 60px; border-radius: 50px; font-size: 32px; font-weight: 700; }
.brand { margin-top: 40px; font-size: 24px; color: #64748b; }
</style>
</head>
<body>
<div class="phone">
<div class="phone-header"><div class="phone-logo"></div><div class="phone-title">SavePin</div></div>
<div class="phone-url">pinterest.com/pin/123456789/</div>
<div class="phone-btn">⬇ Download</div>
<div class="phone-result">
<div class="phone-result-row"><span style="font-size:16px">video_720p.mp4</span><div style="display:flex;gap:8px;align-items:center"><span class="badge-hd">HD</span><span class="download-btn">Save</span></div></div>
<div class="phone-result-row"><span style="font-size:16px">video_1080p.mp4</span><div style="display:flex;gap:8px;align-items:center"><span class="badge-hd">FHD</span><span class="download-btn">Save</span></div></div>
</div>
</div>
<h1>Save Pinterest Videos on <span>Any Device</span></h1>
<p class="subtitle">Works on iPhone, Android, and PC</p>
<div class="cta">Try It Free →</div>
<p class="brand">npftas.xyz</p>
</body>
</html>
